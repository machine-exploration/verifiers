# Same market under a regulator that denies prices above 8.
#   uv run agora fork runs/tacit --at 10 --scenario scenarios/market_capped.toml
world = "agora.worlds.market:Market"
snapshot = "triopoly"
horizon = 30
seed = 0

[[agents]]
name = "a"
policy = "agora.worlds.market:Matcher"

[[agents]]
name = "b"
policy = "agora.worlds.market:Matcher"

[[agents]]
name = "c"
policy = "agora.worlds.market:Matcher"

[[interceptors]]
use = "agora.worlds.market:PriceCap"
cap = 8.0
