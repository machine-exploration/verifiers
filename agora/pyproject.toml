[project]
name = "agora"
version = "0.0.1"
description = "Reproducible, forkable multi-agent worlds: one mediator, one event log."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agora = "agora.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
