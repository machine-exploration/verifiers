[project]
name = "impossible-code"
version = "0.1.0"
description = "impossible-code: coding tasks whose visible tests contradict the specification, so any pass is a reward hack (ImpossibleBench, ported to verifiers)."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[project.optional-dependencies]
convert = ["datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["impossible_code"]
