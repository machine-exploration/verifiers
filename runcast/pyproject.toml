[project]
name = "runcast"
version = "0.0.1"
description = "Pilot: does a learned forecaster of training runs follow a scaling law?"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runcast"]
